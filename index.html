<!DOCTYPE html>
<html>
<head>
    <title>Prasanth Digital App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #0d1117; /* ஒரு ஸ்டைலான டார்க் மோட் பின்னணி */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #ffffff;
        }
        .app-container {
            background-color: #161b22;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 360px;
            width: 90%;
            border: 1px solid #30363d;
        }
        .avatar {
            width: 90px;
            height: 90px;
            background-color: #58a6ff;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            color: #0d1117;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
        }
        h1 {
            font-size: 22px;
            margin: 10px 0 5px 0;
            letter-spacing: 0.5px;
        }
        .bio {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .app-link {
            background-color: #21262d;
            color: #58a6ff;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid #30363d;
            transition: all 0.3s ease;
            display: block;
        }
        .app-link:hover {
            background-color: #30363d;
            color: #ffffff;
            transform: translateY(-2px);
        }
        .footer-text {
            margin-top: 30px;
            font-size: 11px;
            color: #8b949e;
        .avatar-img {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    margin: 0 auto 15px auto;
    object-fit: cover;
    border: 3px solid #58a6ff;
    box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
    display: block;
}

    </style>
</head>
<body>

    <div class="app-container">
        <!-- ப்ரொஃபைல் லோகோ (வட்ட வடிவில் பி என்ற எழுத்து https://ibb.co/ZpDPBB4v
        <h1>PRASANTH GOD</h1>
        <p class="bio">Mobile Coding Explorer 📱<br>Naan Koder App வழியா கோடிங் கத்துக்கிட்டு உருவாக்கிய சொந்த ஆப்!</p>
        
        <div class="links-group">
            <!-- உங்களது உண்மையான லிங்க்குகளை கீழே உள்ள href-ல் மாற்றிக் கொள்ளலாம் -->
            <a href="https://instagram.com" target="_blank" class="app-link">My Instagram 📸</a>
            <a href="https://github.com" target="_blank" class="app-link">My GitHub Projects 💻</a>
            <a href="https://youtube.com" target="_blank" class="app-link">My YouTube Channel 🎥</a>
        </div>
        
        <div class="footer-text">Created by Prasanth • Powered by Vercel</div>
    </div>

</body>
</html>
