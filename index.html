<!DOCTYPE html>
<html>
<head>
    <title>Prasanth Advanced OS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: radial-gradient(circle at center, #0b1329 0%, #020617 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #ffffff;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 0);
            background-size: 24px 24px;
            animation: bgScroll 25s linear infinite;
            z-index: 0;
        }
        @keyframes bgScroll {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -50px); }
        }
        .phone-shell {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 40px rgba(56, 189, 248, 0.25);
            max-width: 360px;
            width: 92%;
            height: 640px;
            border: 2px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        /* 🚀 ஜாவாஸ்கிரிப்ட் இல்லாமல் தானாக மறையும் பக்கா CSS ஸ்பிளாஷ் ஸ்கிரீன் */
        .splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #020617;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            animation: hideSplash 0.5s ease-in-out 2s forwards;
        }
        .loader-bar {
            width: 150px; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; margin-top: 20px; overflow: hidden;
        }
        .loader-fill {
            width: 0%; height: 100%; background: #38bdf8;
            animation: load 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes load { to { width: 100%; } }
        @keyframes hideSplash {
            to { opacity: 0; visibility: hidden; pointer-events: none; }
        }

        /* டாப் ஸ்டேட்டஸ் பார் */
        .status-bar {
            background: rgba(30, 41, 59, 0.4);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #38bdf8;
            border-bottom: 1px solid rgba(56, 189, 248, 0.15);
        }
        /* நோட்டிபிகேஷன் பேனர் */
        .noti-banner {
            background: rgba(56, 189, 248, 0.95);
            color: #020617;
            padding: 10px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            position: absolute;
            left: 5%; width: 90%;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            z-index: 5;
            top: -50px;
            animation: showNotification 4s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2.5s forwards;
        }
        @keyframes showNotification {
            0% { top: -50px; }
            15% { top: 15px; }
            85% { top: 15px; }
            100% { top: -50px; }
        }

        /* மெயின் ஹோம் ஸ்கிரீன் லேஅவுட் */
        .home-screen {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            box-sizing: border-box;
        }
        /* ப்ரொஃபைல் விட்ஜெட் */
        .profile-widget {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(56, 189, 248, 0.15);
        }
        .avatar-ring {
            width: 65px; height: 65px; border-radius: 50%;
            background: linear-gradient(45deg, #00f2fe, #6366f1);
            padding: 2px;
        }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        
        /* மியூசிக் விட்ஜெட் */
        .music-widget {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .visualizer { display: flex; gap: 3px; align-items: flex-end; height: 20px; }
        .bar { width: 3px; height: 5px; background: #38bdf8; animation: bounce 0.6s ease infinite alternate; }
        @keyframes bounce { 100% { height: 20px; } }

        /* ஆப் கிரிட் லான்ச்சர் */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 10px;
        }
        .app-icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        .icon-shape {
            width: 55px; height: 55px; border-radius: 14px;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-weight: 700;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .app-icon-wrapper:hover .icon-shape { transform: scale(1.1); }
        .app-label { font-size: 11px; margin-top: 6px; font-weight: 600; color: #94a3b8; }

        /* இன்-ஆப் விண்டோ சிஸ்டம் */
        .app-window {
            position: absolute;
            top: 100%; left: 0; width: 100%; height: calc(100% - 36px);
            background: #0f172a;
            z-index: 4;
            transition: top 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .app-window.open { top: 36px; }
        .window-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 15px; border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 15px;
        }
        .back-btn { background: none; border: none; color: #38bdf8; font-size: 14px; font-weight: 700; cursor: pointer; }
        
        /* ஸ்கில்ஸ் பார் மற்றும் லிஸ்டுகள் */
        .skill-item { margin-bottom: 15px; }
        .skill-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
        .bar-bg { background: rgba(255,255,255,0.1); height: 6px; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; background: #38bdf8; }
        
        .list-card {
            background: rgba(30, 41, 59, 0.6); padding: 12px; border-radius: 12px;
            margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05);
            text-decoration: none; color: white; display: block;
        }
        .list-card h4 { margin: 0 0 4px 0; color: #38bdf8; font-size: 14px; }
        .list-card p { margin: 0; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="phone-shell">
        <!-- ஸ்பிளாஷ் பூட்டிங் ஸ்கிரீன் -->
        <div id="splash" class="splash-screen">
            <h2 style="letter-spacing: 2px; font-weight: 800; color: #38bdf8; font-size: 20px;">PRASANTH OS</h2>
            <div class="loader-bar"><div class="loader-fill"></div></div>
        </div>

        <!-- சிஸ்டம் நோட்டிபிகேஷன் பேனர் -->
        <div id="noti" class="noti-banner">⚡ 1 New Coding Milestone Achieved!</div>

        <!-- டாப் ஸ்டேட்டஸ் பார் -->
        <div class="status-bar">
            <div>Views: <span id="viewsCount">1,540</span></div>
            <div id="osClock" style="font-weight: 700;">23:48</div>
        </div>

        <!-- மெயின் ஹோம் ஸ்கிரீன் -->
        <div class="home-screen">
            <!-- ப்ரொஃபைல் விட்ஜெட் -->
            <div class="profile-widget">
                <div class="avatar-ring">
                    <img src="https://ibb.co" alt="Prasanth" class="avatar-img">
                </div>
                <div>
                    <div style="font-weight: 800; font-size: 16px; letter-spacing: 0.5px;">PRASANTH GOD</div>
                    <div style="font-size: 11px; color: #22c55e; font-weight: 700; margin-top: 2px;">● SYSTEM ONLINE</div>
                </div>
            </div>

            <!-- மியூசிக் விட்ஜெட் -->
            <div class="music-widget">
                <div>
                    <div style="font-size: 13px; font-weight: 700;">Coding Beats Vol.1</div>
                    <div style="font-size: 10px; color: #6366f1;">Lo-Fi Coding Mode</div>
                </div>
                <div class="visualizer">
                    <div class="bar" style="animation-delay: 0.1s;"></div>
                    <div class="bar" style="animation-delay: 0.3s;"></div>
                    <div class="bar" style="animation-delay: 0.2s;"></div>
                    <div class="bar" style="animation-delay: 0.4s;"></div>
                </div>
            </div>

            <!-- ஆப் கிரிட் லான்ச்சர் -->
            <div class="apps-grid">
                <div class="app-icon-wrapper" onclick="openWindow('winApps')">
