<!DOCTYPE html>
<html>
<head>
    <title>Prasanth Ultimate App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #ffffff;
            overflow-x: hidden;
        }
        /* பின்னணியில் மெதுவாக நகரும் டிஜிட்டல் அலைகள் */
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: linear-gradient(45deg, transparent 45%, rgba(56, 189, 248, 0.05) 50%, transparent 55%);
            background-size: 200% 200%;
            animation: waveMove 8s linear infinite;
            z-index: 0;
        }
        @keyframes waveMove {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .app-container {
            background: rgba(15, 23, 42, 0.8);
            padding: 40px 25px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.15);
            text-align: center;
            max-width: 360px;
            width: 90%;
            border: 1px solid rgba(56, 189, 248, 0.2);
            backdrop-filter: blur(16px);
            z-index: 1;
            position: relative;
        }
        /* 3D நியான் குளோ ரிங் */
        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #6366f1);
            padding: 4px;
            animation: glowRotate 4s linear infinite;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #0f172a;
            display: block;
        }
        @keyframes glowRotate {
            0% { transform: rotate(0deg); box-shadow: 0 0 20px #00f2fe; }
            50% { box-shadow: 0 0 35px #6366f1; }
            100% { transform: rotate(360deg); box-shadow: 0 0 20px #00f2fe; }
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 10px 0 5px 0;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bio {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        /* கவுண்டர் விட்ஜெட் ஸ்டைல் */
        .counter-box {
            background: rgba(30, 41, 59, 0.5);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.1);
            margin-bottom: 25px;
        }
        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 1; }
        }
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .app-link {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #38bdf8;
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: block;
        }
        .app-link:hover {
            border: 1px solid #38bdf8;
            color: #ffffff;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25);
        }
        /* வாட்ஸ்அப் பட்டனுக்கான பிரத்யேக ஸ்டைல் */
        .whatsapp-btn {
            background: linear-gradient(135deg, #15803d 0%, #166534 100%);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .whatsapp-btn:hover {
            border: 1px solid #22c55e;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.25);
        }
        .footer-text {
            margin-top: 35px;
            font-size: 11px;
            color: #64748b;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- உங்களது மாஸான அசல் புகைப்பட லிங்க் -->
        <div class="avatar-wrapper">
            <img src="https://ibb.co" alt="Prasanth" class="avatar-img">
        </div>
        
        <h1>PRASANTH GOD</h1>
        <p class="bio">Advanced Mobile Coder 📱<br>Naan Koder App வழியா கோடிங் கத்துக்கிட்டு உருவாக்கிய அல்டிமேட் வெப் ஆப்!</p>
        
        <!-- லைவ் விசிட்டர்ஸ் கவுண்டர் விட்ஜெட் -->
        <div class="counter-box">
            <span class="pulse-dot"></span>
            <span>Profile Views: <strong id="viewCount">1,482</strong></span>
        </div>
        
        <div class="links-group">
            <a href="https://instagram.com" target="_blank" class="app-link">My Instagram 📸</a>
            <a href="https://github.com" target="_blank" class="app-link">My GitHub Projects 💻</a>
            
            <!-- புதிய வாட்ஸ்அப் குவிக் சாட் பட்டன் -->
            <a href="https://wa.me" target="_blank" class="app-link whatsapp-btn">Chat on WhatsApp 💬</a>
        </div>
        
        <div class="footer-text">Upgraded by Prasanth • Powered by Vercel</div>
    </div>

    <script>
        // பக்கத்தை ஓப்பன் செய்யும் போது விசிட்டர்ஸ் எண்ணிக்கை லேசாக மாறுவது போன்ற சிமுலேஷன் ஸ்கிரிப்ட்
        document.addEventListener("DOMContentLoaded", () => {
            const countEl = document.getElementById("viewCount");
            let currentCount = parseInt(countEl.innerText.replace(',', ''));
            // சீரற்ற முறையில் வியூஸ்களை கூட்டுதல்
            currentCount += Math.floor(Math.random() * 5) + 1;
            countEl.innerText = currentCount.toLocaleString();
        });
    </script>
</body>
</html>
