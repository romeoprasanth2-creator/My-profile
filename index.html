<!DOCTYPE html>
<html>
<head>
    <title>Prasanth Profile</title>
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .profile-card {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .title {
            color: #3498db;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.6;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h1>PRASANTH GOD</h1>
        <div class="title">Junior Web Developer 🚀</div>
        <p>Naan Koder app vazhiya coding kathuka start panniten! Idhu ennoda mudhal phone website.</p>
        
        <!-- Indha button-ai click pannal alert varum -->
        <button class="btn" onclick="sayHello()">Say Hello! 👋</button>
    </div>

    <script>
        function sayHello() {
            alert('Welcome to my website! - Prasanth');
        }
    </script>

</body>
</html>
